<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador 3D Procedural: Humano vs Osos</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --text-main: #e6edf3;
            --accent: #ff7b00;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .ui-layer {
                flex-direction: column;
                justify-content: flex-start;
                gap: 10px;
            }
            .panel {
                width: 100%;
                padding: 15px;
            }
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 123, 0, 0.3);
            padding-bottom: 10px;
        }

        .control {
            margin-bottom: 15px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #8b949e;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        select, button {
            width: 100%;
            padding: 10px;
            background: #21262d;
            color: white;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #e66e00;
        }

        .hint {
            font-size: 0.75rem;
            color: #ff7b00;
            margin-top: -5px;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="ui-layer">
    <div class="panel">
        <h2>Humano (3D Dinámico)</h2>
        <div class="control">
            <label>Altura: <span id="valHHeight">1.75m</span></label>
            <input type="range" id="hHeight" min="1.4" max="2.2" step="0.01" value="1.75">
        </div>
        <div class="control">
            <label>Peso (Masa): <span id="valHWeight">75kg</span></label>
            <input type="range" id="hWeight" min="40" max="160" step="1" value="75">
        </div>
        <span class="hint">*Sube el peso para ver cómo se ensancha la musculatura/grasa.</span>
    </div>

    <div class="panel">
        <h2>Oso (3D Dinámico)</h2>
        <div class="control">
            <select id="bearType">
                <option value="grizzly">Oso Grizzly</option>
                <option value="polar">Oso Polar</option>
                <option value="kodiak">Oso Kodiak</option>
                <option value="negro">Oso Negro Americano</option>
            </select>
        </div>
        <button id="btnAverage">Valores Biológicos Reales</button>
        <hr style="border-color: #30363d; margin: 15px 0;">
        <div class="control">
            <label>Altura (de pie): <span id="valBHeight">2.10m</span></label>
            <input type="range" id="bHeight" min="1.3" max="3.5" step="0.01" value="2.10">
        </div>
        <div class="control">
            <label>Peso (Masa): <span id="valBWeight">270kg</span></label>
            <input type="range" id="bWeight" min="60" max="900" step="5" value="270">
        </div>
        <span class="hint">*Sube el peso y verás la brutal masividad de la bestia.</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // --- SETUP BÁSICO ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    scene.fog = new THREE.FogExp2(0x0d1117, 0.04);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.2, 0);
    controls.maxPolarAngle = Math.PI / 2;

    // --- ILUMINACIÓN REALISTA ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const backLight = new THREE.PointLight(0x4466ff, 0.8);
    backLight.position.set(-5, 2, -5);
    scene.add(backLight);

    // --- SUELO ---
    const floorGeo = new THREE.PlaneGeometry(50, 50);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.9 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(50, 50, 0xff7b00, 0x30363d);
    grid.position.y = 0.01;
    grid.material.opacity = 0.2;
    grid.material.transparent = true;
    scene.add(grid);

    // --- CONSTRUCTORES PROCEDURALES (Magia Pura de Código) ---
    function createHuman() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xe0ac69, roughness: 0.6 });
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), mat);
        head.position.y = 1.65;
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.6, 32), mat);
        torso.position.y = 1.25;
        const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.65, 16), mat);
        armL.position.set(-0.25, 1.2, 0);
        const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.65, 16), mat);
        armR.position.set(0.25, 1.2, 0);
        const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.05, 0.85, 16), mat);
        legL.position.set(-0.09, 0.425, 0);
        const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.05, 0.85, 16), mat);
        legR.position.set(0.09, 0.425, 0);

        group.add(head, torso, armL, armR, legL, legR);
        group.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
        
        group.scale.set(1/1.75, 1/1.75, 1/1.75); // Normaliza a 1 metro
        return group;
    }

    function createBear() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x4a2e15, roughness: 0.9 });
        group.userData.material = mat; // Guardar referencia para cambiar el color luego
        
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.3, 32), mat);
        torso.position.y = 1.1;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), mat);
        head.position.set(0, 1.85, 0.15);
        const snout = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.25, 16), mat);
        snout.rotation.x = Math.PI / 2;
        snout.position.set(0, 1.8, 0.35);
        const earL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), mat);
        earL.position.set(-0.18, 2.05, 0.1);
        const earR = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), mat);
        earR.position.set(0.18, 2.05, 0.1);
        const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 16), mat);
        armL.position.set(-0.45, 1.2, 0.1);
        armL.rotation.z = Math.PI/6;
        const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 16), mat);
        armR.position.set(0.45, 1.2, 0.1);
        armR.rotation.z = -Math.PI/6;
        const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.7, 16), mat);
        legL.position.set(-0.2, 0.35, 0);
        const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.7, 16), mat);
        legR.position.set(0.2, 0.35, 0);

        group.add(torso, head, snout, earL, earR, armL, armR, legL, legR);
        group.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});

        group.scale.set(1/2.1, 1/2.1, 1/2.1); // Normaliza a 1 metro
        return group;
    }

    const humanObj = createHuman();
    humanObj.position.x = -1.5;
    scene.add(humanObj);

    const bearObj = createBear();
    bearObj.position.x = 1.5;
    scene.add(bearObj);

    // --- BASE DE DATOS DE OSOS Y COLORES ---
    const bears = {
        grizzly: { h: 2.10, w: 270, c: 0x4a2e15 },
        polar: { h: 2.60, w: 450, c: 0xf2f8ff },
        kodiak: { h: 2.80, w: 550, c: 0x3d2314 },
        negro: { h: 1.65, w: 130, c: 0x111111 }
    };

    // --- FÍSICAS DE DEFORMACIÓN ---
    const inputs = {
        hHeight: document.getElementById('hHeight'), hWeight: document.getElementById('hWeight'),
        bHeight: document.getElementById('bHeight'), bWeight: document.getElementById('bWeight')
    };

    function updatePhysics() {
        // Textos
        document.getElementById('valHHeight').innerText = parseFloat(inputs.hHeight.value).toFixed(2) + 'm';
        document.getElementById('valHWeight').innerText = inputs.hWeight.value + 'kg';
        document.getElementById('valBHeight').innerText = parseFloat(inputs.bHeight.value).toFixed(2) + 'm';
        document.getElementById('valBWeight').innerText = inputs.bWeight.value + 'kg';

        // DEFORMAR HUMANO (Grasa/Músculo según peso y altura)
        const hH = parseFloat(inputs.hHeight.value);
        const hW = parseFloat(inputs.hWeight.value);
        const bmi = hW / (hH * hH); 
        const hThickness = hH * (0.3 + (bmi / 40)); 
        humanObj.scale.set(hThickness, hH, hThickness);

        // DEFORMAR OSO Y CAMBIAR COLOR
        const type = document.getElementById('bearType').value;
        const bH = parseFloat(inputs.bHeight.value);
        const bW = parseFloat(inputs.bWeight.value);
        const bThickness = bH * (0.35 + (bW / 1200)); 
        
        bearObj.scale.set(bThickness, bH, bThickness);
        bearObj.userData.material.color.setHex(bears[type].c);
    }

    Object.values(inputs).forEach(input => input.addEventListener('input', updatePhysics));

    document.getElementById('btnAverage').addEventListener('click', () => {
        const type = document.getElementById('bearType').value;
        inputs.bHeight.value = bears[type].h;
        inputs.bWeight.value = bears[type].w;
        updatePhysics();
    });

    document.getElementById('bearType').addEventListener('change', () => {
        document.getElementById('btnAverage').click();
    });

    // --- ANIMACIÓN Y REDIMENSIÓN ---
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    
    updatePhysics();
    animate();
</script>
</body>
</html>
