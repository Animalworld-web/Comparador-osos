<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación Fotorrealista: Humano vs Razas de Osos</title>
    <style>
        :root {
            --primary: #1a2c42;
            --accent: #d4a017;
            --bg: #0d1117;
            --card-bg: #161b22;
            --text: #ecf0f1;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1300px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 980px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .canvas-container {
                order: -1;
                height: 500px !important;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .panel h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
            color: var(--accent);
            font-size: 1.4rem;
        }

        .control-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95em;
            color: rgba(236, 240, 241, 0.8);
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 8px;
            background: transparent;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #2a3b55;
            border-radius: 3px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 1rem;
            margin-bottom: 12px;
            background-color: #21262d;
            color: var(--text);
            font-family: inherit;
        }

        select:focus, button:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #f1c40f;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(212, 160, 23, 0.4);
        }

        .canvas-container {
            background: #000;
            height: 650px;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            border: 2px solid #2a3b55;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        #realtime-canvas {
            width: 100%;
            height: 100%;
        }

        /* Overlay para las etiquetas de datos */
        .overlay-stats {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.9em;
            text-align: center;
            border: 1px solid rgba(212, 160, 23, 0.4);
        }

        .stat-box strong {
            color: var(--accent);
            display: block;
            margin-bottom: 3px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>Simulación Fotorrealista: Humano vs Osos</h1>
    
    <div class="dashboard">
        <div class="panel">
            <h2>Humano Realista</h2>
            <div class="control-group">
                <label for="genderSelect">Género</label>
                <select id="genderSelect" onchange="updateSimulation()">
                    <option value="male">Masculino</option>
                    <option value="female">Femenino</option>
                </select>
            </div>
            <div class="control-group">
                <label>Altura (m): <span id="humanHeightVal">1.75</span> m</label>
                <input type="range" id="humanHeight" min="1.0" max="2.3" step="0.01" value="1.75" oninput="updateSimulation()">
            </div>
            <div class="control-group">
                <label>Peso (kg): <span id="humanWeightVal">75</span> kg</label>
                <input type="range" id="humanWeight" min="40" max="160" step="1" value="75" oninput="updateSimulation()">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="realtime-canvas"></canvas>
            <div class="overlay-stats">
                <div class="stat-box">
                    <strong>HUMANO</strong>
                    <span id="humanStats">1.75m / 75kg</span>
                </div>
                <div class="stat-box">
                    <strong id="bearLabel">OSO GRIZZLY</strong>
                    <span id="bearStats">2.10m / 270kg</span>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Oso Fotorrealista</h2>
            <div class="control-group">
                <label for="bearBreed">Especie de Oso</label>
                <select id="bearBreed" onchange="changeBearBreed()">
                    <option value="grizzly">Oso Grizzly</option>
                    <option value="polar">Oso Polar</option>
                    <option value="pardo_eur">Oso Pardo Europeo</option>
                    <option value="kodiak">Oso Kodiak</option>
                    <option value="negro">Oso Negro Americano</option>
                </select>
            </div>
            <button onclick="setToAverage()">Valores Promedio</button>
            <hr style="border:0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
            <div class="control-group">
                <label>Altura (de pie, m): <span id="bearHeightVal">2.10</span> m</label>
                <input type="range" id="bearHeight" min="1.5" max="3.5" step="0.01" value="2.10" oninput="updateSimulation()">
            </div>
            <div class="control-group">
                <label>Peso (kg): <span id="bearWeightVal">270</span> kg</label>
                <input type="range" id="bearWeight" min="90" max="900" step="10" value="270" oninput="updateSimulation()">
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    // Variables principales de Three.js
    let scene, camera, renderer, controls, humanModel, bearModel;
    const canvas = document.getElementById('realtime-canvas');

    // Base de datos biológica de los osos (Valores promedio y límites)
    const bearData = {
        grizzly: {
            name: "Oso Grizzly",
            avgHeight: 2.10, avgWeight: 270,
            minHeight: 1.7, maxHeight: 2.8,
            minWeight: 130, maxWeight: 450,
            color: 0x5c4033, texture: 'https://threejs.org/examples/textures/terrain/grasslight-big.jpg' // Placeholder
        },
        polar: {
            name: "Oso Polar",
            avgHeight: 2.60, avgWeight: 500,
            minHeight: 2.1, maxHeight: 3.2,
            minWeight: 180, maxWeight: 800,
            color: 0xf0f0f0, texture: null
        },
        pardo_eur: {
            name: "Oso Pardo Europeo",
            avgHeight: 2.00, avgWeight: 210,
            minHeight: 1.6, maxHeight: 2.6,
            minWeight: 110, maxWeight: 350,
            color: 0x6e4d3a, texture: null
        },
        kodiak: {
            name: "Oso Kodiak",
            avgHeight: 2.90, avgWeight: 550,
            minHeight: 2.4, maxHeight: 3.4,
            minWeight: 250, maxWeight: 900,
            color: 0x4e3629, texture: null
        },
        negro: {
            name: "Oso Negro Americano",
            avgHeight: 1.70, avgWeight: 150,
            minHeight: 1.3, maxHeight: 2.1,
            minWeight: 70, maxWeight: 320,
            color: 0x1a1a1a, texture: null
        }
    };

    // Inicialización de la escena 3D
    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.Fog(0x050505, 5, 15);

        // Cámara
        camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
        camera.position.set(0, 1.8, 6); // Altura de los ojos

        // Renderer
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Controles de cámara
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 10;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // No bajar del suelo

        // Iluminación realista (Studio setup)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 5, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 20;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-5, 3, -2);
        scene.add(fillLight);

        // Suelo realista (Tierra/Hierba)
        const groundGeometry = new THREE.CircleGeometry(10, 64);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2c3e50,
            roughness: 0.9,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper para referencia de escala
        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
        scene.add(gridHelper);

        // Creación de modelos fotorrealistas (Placeholders avanzados con MeshStandardMaterial)
        
        // 1. Modelo Humano Realista (Placeholder detallado)
        const humanGeometry = new THREE.CylinderGeometry(0.25, 0.2, 1.75, 16); // Altura base 1.75
        humanGeometry.translate(0, 1.75/2, 0); // Pivote en los pies
        const humanMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xe0ac69, 
            roughness: 0.6,
            metalness: 0.0
        });
        humanModel = new THREE.Mesh(humanGeometry, humanMaterial);
        humanModel.position.set(-0.8, 0, 0);
        humanModel.castShadow = true;
        humanModel.receiveShadow = true;
        scene.add(humanModel);

        // 2. Modelo Oso Realista (Placeholder detallado con joroba)
        const bearGeometry = new THREE.BoxGeometry(0.9, 2.1, 0.7); // Dimensiones base Grizzly de pie
        bearGeometry.translate(0, 2.1/2, 0); // Pivote en los pies
        
        // Añadir joroba distintiva del Grizzly
        const humpGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        humpGeometry.translate(0, 1.7, 0);
        bearGeometry.merge(humpGeometry); // Combinar geometrías

        bearModel = new THREE.Mesh(bearGeometry, new THREE.MeshStandardMaterial());
        bearModel.position.set(0.8, 0, 0);
        bearModel.castShadow = true;
        bearModel.receiveShadow = true;
        scene.add(bearModel);

        // Iniciar loop de renderizado
        animate();
        
        // Configuración inicial
        changeBearBreed();
    }

    // Loop de animación
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    // Al cambiar la raza del oso, redefinimos los límites y el modelo visual
    function changeBearBreed() {
        const breed = document.getElementById("bearBreed").value;
        const data = bearData[breed];
        
        const heightSlider = document.getElementById("bearHeight");
        const weightSlider = document.getElementById("bearWeight");

        heightSlider.min = data.minHeight;
        heightSlider.max = data.maxHeight;
        weightSlider.min = data.minWeight;
        weightSlider.max = data.maxWeight;

        // Actualizar material del oso (color/textura)
        const bearMaterial = bearModel.material;
        bearMaterial.color.setHex(data.color);
        bearMaterial.roughness = 0.9;
        
        // Ajustar geometría si es polar (más alargado) o negro (más estilizado)
        if (breed === 'polar') {
            bearModel.scale.set(1.1, 1, 0.9); // Más ancho y estilizado
        } else if (breed === 'negro') {
            bearModel.scale.set(0.9, 1, 0.8); // Más pequeño y compacto
        } else {
            bearModel.scale.set(1, 1, 1); // Reset
        }

        setToAverage();
    }

    // Lleva al oso seleccionado a sus valores biológicos promedio
    function setToAverage() {
        const breed = document.getElementById("bearBreed").value;
        const data = bearData[breed];

        document.getElementById("bearHeight").value = data.avgHeight;
        document.getElementById("bearWeight").value = data.avgWeight;

        updateSimulation();
    }

    // Actualiza los datos y la escala fotorrealista en la escena 3D
    function updateSimulation() {
        // --- Datos del Humano ---
        const humanHeight = parseFloat(document.getElementById("humanHeight").value);
        const humanWeight = parseInt(document.getElementById("humanWeight").value);
        const gender = document.getElementById("genderSelect").value;
        
        document.getElementById("humanHeightVal").innerText = humanHeight.toFixed(2);
        document.getElementById("humanWeightVal").innerText = humanWeight;
        
        document.getElementById("humanStats").innerText = `${humanHeight.toFixed(2)}m / ${humanWeight}kg`;

        // Actualizar color de piel según género (Placeholder simple)
        humanModel.material.color.setHex(gender === 'male' ? 0xe0ac69 : 0xffdab9);

        // --- Datos del Oso ---
        const breed = document.getElementById("bearBreed").value;
        const bearHeight = parseFloat(document.getElementById("bearHeight").value);
        const bearWeight = parseInt(document.getElementById("bearWeight").value);
        
        document.getElementById("bearHeightVal").innerText = bearHeight.toFixed(2);
        document.getElementById("bearWeightVal").innerText = bearWeight;
        
        document.getElementById("bearLabel").innerText = bearData[breed].name.toUpperCase();
        document.getElementById("bearStats").innerText = `${bearHeight.toFixed(2)}m / ${bearWeight}kg`;

        // --- Escala Fotorrealista 3D ---
        
        // 1. Escalar Humano
        // La altura base de la geometría es 1.75m. Escalamiento en Y.
        const humanScaleY = humanHeight / 1.75;
        // El ancho (X, Z) se escala ligeramente con el peso
        const humanScaleXZ = 1.0 + (humanWeight - 75) / 300; 
        humanModel.scale.set(humanScaleXZ, humanScaleY, humanScaleXZ);

        // 2. Escalar Oso
        // La altura base de la geometría es 2.1m (Grizzly).
        const bearScaleY = bearHeight / 2.1;
        // La masividad (ancho X, Z) se escala más drásticamente con el peso
        const bearScaleXZ = 1.0 + (bearWeight - 270) / 700; // max ~1.9x masividad
        bearModel.scale.set(bearScaleXZ, bearScaleY, bearScaleXZ);
    }

    // Manejar redimensionado de ventana
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = canvas.clientWidth / canvas.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    }

    // Iniciar todo
    init3D();
</script>

</body>
</html>
