<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Tamaño: Humanos vs Osos</title>
    <style>
        :root {
            --primary: #2b4c6f;
            --accent: #8b5a2b;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .canvas-container {
                order: -1;
                height: 400px !important;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .panel h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            color: var(--primary);
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9em;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        select, button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        select:focus, button:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #6e4420;
        }

        .canvas-container {
            background: #eef2f5;
            height: 550px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #ddd;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
        }

        /* Suelo de la simulación */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background-color: #bcbaa6;
            z-index: 1;
        }

        /* Contenedores de las siluetas */
        .display-area {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            width: 100%;
            height: 90%;
            z-index: 2;
            padding: 0 50px;
        }

        .character {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: height 0.3s ease, width 0.3s ease;
            position: relative;
        }

        .silhouette {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
        }

        /* SVG Siluetas en CSS (Incrustadas para evitar archivos externos) */
        .human-male .silhouette {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232b4c6f'><path d='M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M21,9A1,1 0 0,0 20,8H17V4A1,1 0 0,0 16,3H8A1,1 0 0,0 7,4V8H4A1,1 0 0,0 3,9V16A1,1 0 0,0 4,17H7V22A1,1 0 0,0 8,23H10A1,1 0 0,0 11,22V17H13V22A1,1 0 0,0 14,23H16A1,1 0 0,0 17,22V17H20A1,1 0 0,0 21,16V9Z'/></svg>");
        }

        .human-female .silhouette {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e056fd'><path d='M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M18,10l-2.71,-4.34A2,2 0 0,0 13.62,4.75H10.38a2,2 0 0,0 -1.67,0.91L6,10l3.5,6H8v5a1,1 0 0,0 1,1h2v-4h2v4h2a1,1 0 0,0 1,-1v-5h-1.5L18,10Z'/></svg>");
        }

        .bear-shape .silhouette {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235c4033'><path d='M12 2C10.5 2 9 3.5 9 5c0 .3.1.7.2 1H7.8C7.4 5.4 6.7 5 6 5c-1.1 0-2 .9-2 2 0 .7.4 1.4 1 1.8v3.4c-1.1.4-2 1.5-2 2.8v5c0 1.1.9 2 2 2h1c1.1 0 2-.9 2-2v-2h8v2c0 1.1.9 2 2 2h1c1.1 0 2-.9 2-2v-5c0-1.3-.9-2.4-2-2.8V8.8c.6-.4 1-1.1 1-1.8 0-1.1-.9-2-2-2-.7 0-1.4.4-1.8 1h-1.4c.1-.3.2-.7.2-1 0-1.5-1.5-3-3-3zm-3 7h6v2H9V9z'/></svg>");
        }

        .label-tag {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-top: 5px;
            text-align: center;
            white-space: nowrap;
        }

        .stats-display {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Interactivo: Humano vs Razas de Osos</h1>
    
    <div class="dashboard">
        <!-- PANEL HUMANO -->
        <div class="panel">
            <h2>Humano</h2>
            <div class="control-group">
                <label for="genderSelect">Género</label>
                <select id="genderSelect" onchange="updateSimulation()">
                    <option value="male">Masculino</option>
                    <option value="female">Femenino</option>
                </select>
            </div>
            <div class="control-group">
                <label>Altura: <span id="humanHeightVal">1.75</span> m</label>
                <input type="range" id="humanHeight" min="1.0" max="2.2" step="0.01" value="1.75" oninput="updateSimulation()">
            </div>
            <div class="control-group">
                <label>Peso: <span id="humanWeightVal">75</span> kg</label>
                <input type="range" id="humanWeight" min="40" max="150" step="1" value="75" oninput="updateSimulation()">
            </div>
        </div>

        <!-- PANTALLA EN VIVO -->
        <div class="canvas-container">
            <div class="display-area">
                <!-- Humano -->
                <div id="humanChar" class="character human-male">
                    <div class="silhouette"></div>
                    <span class="label-tag">Humano</span>
                    <span class="stats-display" id="humanStats">1.75m / 75kg</span>
                </div>
                <!-- Oso -->
                <div id="bearChar" class="character bear-shape">
                    <div class="silhouette"></div>
                    <span class="label-tag" id="bearLabel">Oso Grizzly</span>
                    <span class="stats-display" id="bearStats">2.00m / 270kg</span>
                </div>
            </div>
            <div class="ground"></div>
        </div>

        <!-- PANEL OSO -->
        <div class="panel">
            <h2>Oso</h2>
            <div class="control-group">
                <label for="bearBreed">Especie de Oso</label>
                <select id="bearBreed" onchange="changeBearBreed()">
                    <option value="grizzly">Oso Grizzly</option>
                    <option value="polar">Oso Polar</option>
                    <option value="pardo_eur">Oso Pardo Europeo</option>
                    <option value="kodiak">Oso Kodiak</option>
                    <option value="negro">Oso Negro Americano</option>
                </select>
            </div>
            <button onclick="setToAverage()">Valores Promedio</button>
            <hr style="border:0; border-top: 1px solid #ddd; margin: 15px 0;">
            <div class="control-group">
                <label>Altura (de pie): <span id="bearHeightVal">2.00</span> m</label>
                <input type="range" id="bearHeight" min="1.5" max="3.5" step="0.01" value="2.00" oninput="updateSimulation()">
            </div>
            <div class="control-group">
                <label>Peso: <span id="bearWeightVal">270</span> kg</label>
                <input type="range" id="bearWeight" min="90" max="800" step="5" value="270" oninput="updateSimulation()">
            </div>
        </div>
    </div>
</div>

<script>
    // Base de datos biológica de los osos (Valores promedio y límites de escala)
    const bearData = {
        grizzly: {
            name: "Oso Grizzly",
            avgHeight: 2.10,
            avgWeight: 270,
            minHeight: 1.7,
            maxHeight: 2.8,
            minWeight: 130,
            maxWeight: 360
        },
        polar: {
            name: "Oso Polar",
            avgHeight: 2.60,
            avgWeight: 450,
            minHeight: 2.0,
            maxHeight: 3.1,
            minWeight: 150,
            maxWeight: 700
        },
        pardo_eur: {
            name: "Oso Pardo Europeo",
            avgHeight: 2.00,
            avgWeight: 200,
            minHeight: 1.5,
            maxHeight: 2.5,
            minWeight: 100,
            maxWeight: 300
        },
        kodiak: {
            name: "Oso Kodiak",
            avgHeight: 2.80,
            avgWeight: 500,
            minHeight: 2.2,
            maxHeight: 3.3,
            minWeight: 220,
            maxWeight: 680
        },
        negro: {
            name: "Oso Negro Americano",
            avgHeight: 1.65,
            avgWeight: 140,
            minHeight: 1.2,
            maxHeight: 2.0,
            minWeight: 60,
            maxWeight: 300
        }
    };

    // Al cambiar la raza del oso, redefinimos los límites de los sliders
    function changeBearBreed() {
        const breed = document.getElementById("bearBreed").value;
        const data = bearData[breed];
        
        const heightSlider = document.getElementById("bearHeight");
        const weightSlider = document.getElementById("bearWeight");

        heightSlider.min = data.minHeight;
        heightSlider.max = data.maxHeight;
        weightSlider.min = data.minWeight;
        weightSlider.max = data.maxWeight;

        // Por defecto al cambiar, los llevamos al promedio de esa especie
        setToAverage();
    }

    // Lleva al oso seleccionado a sus valores biológicos promedio
    function setToAverage() {
        const breed = document.getElementById("bearBreed").value;
        const data = bearData[breed];

        document.getElementById("bearHeight").value = data.avgHeight;
        document.getElementById("bearWeight").value = data.avgWeight;

        updateSimulation();
    }

    // Dibuja y escala visualmente los personajes según sus datos
    function updateSimulation() {
        // --- Datos del Humano ---
        const humanHeight = parseFloat(document.getElementById("humanHeight").value);
        const humanWeight = parseInt(document.getElementById("humanWeight").value);
        const gender = document.getElementById("genderSelect").value;
        
        document.getElementById("humanHeightVal").innerText = humanHeight.toFixed(2);
        document.getElementById("humanWeightVal").innerText = humanWeight;
        
        const humanChar = document.getElementById("humanChar");
        humanChar.className = `character human-${gender}`;
        document.getElementById("humanStats").innerText = `${humanHeight.toFixed(2)}m / ${humanWeight}kg`;

        // --- Datos del Oso ---
        const breed = document.getElementById("bearBreed").value;
        const bearHeight = parseFloat(document.getElementById("bearHeight").value);
        const bearWeight = parseInt(document.getElementById("bearWeight").value);
        
        document.getElementById("bearHeightVal").innerText = bearHeight.toFixed(2);
        document.getElementById("bearWeightVal").innerText = bearWeight;
        
        document.getElementById("bearLabel").innerText = bearData[breed].name;
        document.getElementById("bearStats").innerText = `${bearHeight.toFixed(2)}m / ${bearWeight}kg`;

        // --- Lógica de Escala Visual ---
        // Usamos la altura máxima posible (3.5 metros) como el 100% de la altura del contenedor.
        const maxHeightInSimulation = 3.5; 
        
        const humanVisualHeight = (humanHeight / maxHeightInSimulation) * 100;
        const bearVisualHeight = (bearHeight / maxHeightInSimulation) * 100;

        // El ancho se calcula proporcionalmente al peso para dar sensación de robustez
        // Tomamos una proporción base y le sumamos un extra basado en los kg
        const humanVisualWidth = 40 + (humanWeight / 150) * 40; // max 80px aprox
        const bearVisualWidth = 70 + (bearWeight / 800) * 110;  // max 180px aprox

        // Aplicamos los estilos CSS en tiempo real
        humanChar.style.height = `${humanVisualHeight}%`;
        humanChar.style.width = `${humanVisualWidth}px`;

        const bearChar = document.getElementById("bearChar");
        bearChar.style.height = `${bearVisualHeight}%`;
        bearChar.style.width = `${bearVisualWidth}px`;
    }

    // Iniciar la simulación con los valores iniciales por defecto
    changeBearBreed();
</script>

</body>
</html>
